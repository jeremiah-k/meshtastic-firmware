; Common settings for rp2040 Processor based targets
[rp2040_base]
platform =
  # TODO renovate
  https://github.com/maxgerhardt/platform-raspberrypi#aa70b802be8851668053d4f09734e4089fe41932
  ; For arduino-pico >= 5.6.1
extends = arduino_base
platform_packages =
  # TODO renovate
  arduino-pico@https://github.com/earlephilhower/arduino-pico/releases/download/6.0.0/rp2040-6.0.0.zip

board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags =
  ${arduino_base.build_flags} -Wno-unused-variable -Wcast-align
  -Isrc/platform/rp2xx0
  -Isrc/platform/rp2xx0/hardware_rosc/include
  -Isrc/platform/rp2xx0/pico_sleep/include
  -D__PLAT_RP2040__
  -D__FREERTOS=1
#  -D _POSIX_THREADS
build_src_filter = 
  ${arduino_base.build_src_filter} +<platform/rp2xx0/> -<nimble/> -<modules/esp32> -<mesh/eth/> -<mesh/wifi/> -<mesh/http/> -<mesh/raspihttp>

lib_ignore =
  BluetoothOTA
  lvgl
  # arduino-pico bundles the iLabs Hearth library for Challenger WiFi6 boards;
  # nothing in this tree includes it, but PlatformIO Core 6.1.19 LDF discovers
  # it through the WiFi library chain and its missing-variant #error fails
  # every rp2040 build on GitHub-hosted runners. lib_ignore matches the
  # library.properties name ("iLabs Hearth"), not the folder name.
  iLabs Hearth

lib_deps =
  ${arduino_base.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=github-tags depName=meshtastic/Crypto packageName=meshtastic/Crypto
  https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip
